name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annule les exécutions redondantes sur une même branche.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Vérification (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # On teste sur la version du poste de développement et sur une LTS récente.
        node: [18, 20]

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm install` plutôt que `npm ci` : le lock est généré sous Windows et
      # n'inclut pas les binaires optionnels de rollup pour Linux
      # (bug npm connu #4828). `install` résout le binaire de la plateforme.
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Vérification des types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Tests
        run: npm run test:coverage

      - name: Publier la couverture
        if: matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Build API + interface web
        run: npm run build
